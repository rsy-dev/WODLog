<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f1"><title>WODLog · 오늘의 기록</title>
<style>
:root{color-scheme:light;--bg:#f6f5f1;--ink:#202d31;--muted:#637071;--line:#e3e6e1;--accent:#b54124;--green:#296452}*{box-sizing:border-box}body{margin:0;background:#e8ebe7;color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit;border:0;background:none;min-height:44px;min-width:44px}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #267aaf;outline-offset:3px}button:disabled{opacity:.5}svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}h1,h2,h3,p{margin:0}h1{overflow-wrap:anywhere;min-width:0;font-size:32px;letter-spacing:-1.2px;line-height:1.25}h2{font-size:18px;letter-spacing:-.4px}h3{font-size:17px}small,.sub{color:var(--muted);font-size:13px}.app{max-width:430px;min-height:100dvh;margin:auto;background:var(--bg);position:relative;padding-bottom:calc(92px + env(safe-area-inset-bottom))}header{padding:calc(18px + env(safe-area-inset-top)) 24px 12px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:18px;font-weight:800;letter-spacing:-.6px;display:flex;align-items:center;gap:9px}.mark{display:grid;place-items:center;background:var(--ink);color:white;border-radius:9px;width:30px;height:30px;font-size:19px;font-style:italic}.icon{display:inline-flex;align-items:center;justify-content:center;border-radius:50%}.icon:hover{background:#e7e9e3}main:focus{outline:none}main{padding:16px 24px 24px}.row>.text-button{flex-shrink:0}.row{display:flex;align-items:center;justify-content:space-between;gap:16px}.stack{display:grid;gap:16px}.eyebrow{font-size:12px;letter-spacing:1.4px;color:var(--muted);font-weight:700;margin-bottom:10px}.intro{margin-bottom:28px}.intro p{margin-top:10px;color:var(--muted);font-size:14px}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:20px}.hero{padding:24px;margin-bottom:24px}.hero h2{font-size:23px;letter-spacing:-.8px;margin:16px 0 8px}.hero p{font-size:14px;color:var(--muted);margin-bottom:24px}.stamp{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;background:#f7eee7;color:var(--accent)}.primary{width:100%;background:var(--accent);color:white;min-height:54px;border-radius:14px;font-weight:700;display:flex;gap:10px;align-items:center;justify-content:center}.secondary{border:1px solid var(--line);border-radius:12px;min-height:48px;padding:10px 16px;background:white}.section-title{margin:24px 0 14px}.metric{font-size:29px;font-weight:750;letter-spacing:-1px}.metric small{font-size:14px;font-weight:400;letter-spacing:0}.week{display:flex;justify-content:space-between;gap:6px;margin-top:18px}.day{text-align:center;color:var(--muted);font-size:11px}.dot{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#f0f2ed;margin-top:8px;color:var(--muted);font-size:12px}.dot.done{background:var(--green);color:white}.dot.today{outline:1px solid var(--ink);outline-offset:3px}.record{display:flex;width:100%;text-align:left;align-items:center;gap:14px;padding:18px 0;border-bottom:1px solid var(--line)}.record:last-child{border-bottom:0}.record .copy{flex:1;min-width:0}.record strong{overflow-wrap:anywhere;display:block;font-size:16px}.record small{display:block;margin-top:4px}.record .score{font-size:18px;font-weight:700;white-space:nowrap}.chevron{width:16px;height:16px;color:var(--muted)}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,430px);display:flex;padding:10px 18px calc(12px + env(safe-area-inset-bottom));background:#fbfcf9f5;border-top:1px solid var(--line);backdrop-filter:blur(16px);z-index:2}nav button{flex:1;display:grid;justify-items:center;gap:4px;font-size:11px;color:var(--muted);padding:5px}nav button[aria-current=page]{color:var(--accent);font-weight:750}.hidden{display:none!important}.tag{font-size:12px;padding:5px 9px;border-radius:7px;background:#edf3ee;color:var(--green)}label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}input,select,textarea{width:100%;min-height:48px;border:1px solid #cdd3ce;border-radius:12px;padding:12px;background:white;color:var(--ink)}textarea{resize:vertical;min-height:90px}input[type=checkbox]{width:22px;min-height:22px}.field{margin-top:20px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.score-input{font-size:28px;text-align:center;font-variant-numeric:tabular-nums}.hint{font-size:13px;color:var(--muted);margin-top:8px}.text-button{color:var(--accent);font-size:14px;padding:8px 0;text-align:left}details{border-top:1px solid var(--line);margin-top:20px}summary{cursor:pointer;min-height:52px;padding:16px 0;font-size:14px;font-weight:600}details p{font-size:14px;color:var(--muted);line-height:1.8}.editor-footer{margin-top:24px}.notice{color:var(--muted);font-size:12px;text-align:center;margin-top:12px}.sheet{border:0;border-radius:24px 24px 0 0;padding:0;background:var(--bg);color:var(--ink);width:min(100%,430px);max-width:430px;max-height:88dvh;margin:auto auto 0;overscroll-behavior:contain}.sheet::backdrop{background:#14221e66;backdrop-filter:blur(3px)}.sheet-inner{padding:12px 24px calc(28px + env(safe-area-inset-bottom))}.handle{height:4px;width:34px;background:#c6ccc6;border-radius:5px;margin:0 auto 12px}.sheet .row{margin-bottom:20px}.menu-item{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:16px 0;gap:12px;border-bottom:1px solid var(--line)}.menu-item span{flex:1}.menu-item small{display:block;margin-top:4px}.bars{height:110px;display:flex;align-items:flex-end;justify-content:space-around;gap:16px;margin:24px 0 10px}.bar{width:36px;border-radius:7px 7px 0 0;background:#b8ccc0}.bar.current{background:var(--green)}.toast{position:fixed;z-index:5;bottom:100px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:12px 20px;border-radius:14px;width:max-content;max-width:90%;font-size:14px}.empty{padding:20px 0;color:var(--muted);font-size:14px}.checkrow{display:flex;align-items:center;gap:12px;min-height:48px}.back{margin-left:-12px}.back svg{width:24px}.editor-head{margin-bottom:24px}.setting-value{font-size:14px;color:var(--muted)}@media(max-width:359px){header{padding-left:20px;padding-right:20px}main{padding-left:20px;padding-right:20px}.hero,.card{padding:18px}h1{font-size:29px}.week{gap:3px}.dot{width:27px;height:27px}.sheet-inner{padding-left:20px;padding-right:20px}}@media(prefers-reduced-motion:no-preference){button{transition:background .15s}}
</style>
</head>
<body>
<svg aria-hidden="true" style="position:absolute;width:0;height:0"><defs>
<symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="calendar" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M8 3v4m8-4v4M4 11h16m-11 4h2m3 0h2"/></symbol><symbol id="history" viewBox="0 0 24 24"><path d="M3 11a9 9 0 1 1 2 7M3 5v6h6m3-4v6l4 2"/></symbol><symbol id="chart" viewBox="0 0 24 24"><path d="M4 4v16h17M8 15l4-5 4 2 5-7"/></symbol><symbol id="more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol><symbol id="arrow" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol><symbol id="back" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol><symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol><symbol id="weight" viewBox="0 0 24 24"><path d="M3 9v6m4-9v12m10-12v12m4-9v6M7 12h10"/></symbol>
</defs></svg>
<div class="app">
<header><div class="brand"><span class="mark" aria-hidden="true">W</span>WODLog</div><button class="icon" aria-label="더 보기 및 설정" onclick="openSheet('menu')"><svg><use href="#more"/></svg></button></header>
<main id="main" tabindex="-1"></main>
<nav aria-label="주요 탐색"><button data-page="today" aria-current="page" onclick="navigate('today')"><svg aria-hidden="true"><use href="#calendar"/></svg>오늘</button><button data-page="history" onclick="navigate('history')"><svg aria-hidden="true"><use href="#history"/></svg>기록</button><button data-page="progress" onclick="navigate('progress')"><svg aria-hidden="true"><use href="#chart"/></svg>성장</button></nav>
</div>
<dialog class="sheet" id="sheet" aria-labelledby="sheet-title"><div class="sheet-inner"><div class="handle" aria-hidden="true"></div><div class="row"><h2 id="sheet-title"></h2><button class="icon" aria-label="시트 닫기" onclick="closeSheet()"><svg aria-hidden="true"><use href="#close"/></svg></button></div><div id="sheet-body"></div></div></dialog>
<div id="toast" class="toast hidden" role="status"></div>
<script>
// Standalone UI study. Sample sessions are isolated from the real app's SQLite/web DB.
const $=s=>document.querySelector(s), icon=(id,cls='')=>`<svg aria-hidden="true" class="${cls}"><use href="#${id}"/></svg>`;
const referenceDate='2026-11-28';let selectedDate=referenceDate,page='today',unit='kg',returnFocus=null,draft=null;
let records=[{id:1,date:'2026-11-26',title:'Fran',minutes:'6',seconds:'42',rx:true,note:'마지막 풀업까지 페이스 유지',strength:null},{id:2,date:'2026-11-24',title:'Cindy',rounds:12,rx:false,note:'풀업은 밴드 사용',strength:null},{id:3,date:'2026-11-23',title:'Fran',minutes:'7',seconds:'08',rx:true,note:'',strength:null}];
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
try{const stored=JSON.parse(localStorage.getItem('wodlog-minimal-ios-v1'));if(stored&&Array.isArray(stored.records)&&stored.records.every(r=>r&&typeof r.title==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(r.date))){records=stored.records;unit=stored.unit==='lb'?'lb':'kg'}}catch{}
function persist(){try{localStorage.setItem('wodlog-minimal-ios-v1',JSON.stringify({records,unit}));return true}catch{return false}}
function score(r){return r.rounds!=null?`${r.rounds} 라운드`:`${r.minutes}′ ${String(r.seconds).padStart(2,'0')}″`}
function dateText(date){return new Date(date+'T12:00:00').toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'})}
function recordList(list){return list.length?list.map(r=>`<button class="record" onclick="showRecord(${Number(r.id)})"><div class="copy"><strong>${escapeHtml(r.title)}</strong><small>${escapeHtml(dateText(r.date))} · ${r.rx?'Rx · 처방대로':'Scaled · 조정'}</small></div><span class="score">${escapeHtml(score(r))}</span>${icon('arrow','chevron')}</button>`).join(''):'<p class="empty">아직 기록이 없어요. 첫 운동을 남겨보세요.</p>'}
function navigate(next){page=next;document.querySelectorAll('nav button').forEach(b=>{b.removeAttribute('aria-current');if(b.dataset.page===page)b.setAttribute('aria-current','page')});$('nav').classList.toggle('hidden',page==='editor');render();window.scrollTo(0,0);$('#main').focus({preventScroll:true})}
function render(){const main=$('#main');if(page==='today'){const today=records.filter(r=>r.date===selectedDate);main.innerHTML=`<div class="intro"><div class="row"><div><div class="eyebrow">YOUR DAILY PRACTICE</div><h1>${selectedDate===referenceDate?'오늘의 운동':'운동 기록'}</h1></div><button class="icon" aria-label="운동 날짜 선택" onclick="openSheet('date')">${icon('calendar')}</button></div><p>${dateText(selectedDate)} <span aria-hidden="true">·</span> 한 번의 운동, 하나의 기록</p></div><section class="card hero"><div class="stamp">${icon('weight')}</div><h2>${today.length?'오늘도 한 걸음 더.':'오늘의 노력을 남겨요.'}</h2><p>WOD 결과부터 근력 세트까지.<br>내 페이스대로 차곡차곡 기록하세요.</p><button class="primary" onclick="startWorkout()">${icon('plus')}운동 기록하기</button></section><section class="card"><div class="row"><h2>최근 7일</h2><span class="sub">운동한 날</span></div><div class="metric" style="margin-top:12px">${new Set(records.filter(r=>r.date>='2026-11-22'&&r.date<=referenceDate).map(r=>r.date)).size}<small> / 7일</small></div><div class="week">${['일','월','화','수','목','금','토'].map((d,i)=>{const date='2026-11-'+(22+i),done=records.some(r=>r.date===date);return `<div class="day">${d}<span class="dot ${done?'done':''} ${i===6?'today':''}" aria-label="11월 ${22+i}일 ${done?'운동 기록 있음':'기록 없음'}">${done?'✓':22+i}</span></div>`}).join('')}</div></section><div class="row section-title"><h2>${today.length?'이 날짜의 기록':'최근 기록'}</h2><button class="text-button" onclick="navigate('history')">전체 보기</button></div>${recordList(today.length?today:records.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,2))}<p class="notice">인터랙티브 목업 · 2026년 11월 28일 기준</p>`}
else if(page==='history'){main.innerHTML=`<div class="intro"><div class="eyebrow">HISTORY</div><h1>쌓여가는 기록</h1><p>운동한 날의 작은 성취를 돌아보세요.</p></div><label for="filter">운동 검색</label><input id="filter" type="search" placeholder="Fran, Cindy…" oninput="filterHistory(this.value)"><div class="row section-title"><h2>전체 기록</h2><span class="sub" id="count">${records.length}회</span></div><div id="history-list">${recordList(records.slice().sort((a,b)=>b.date.localeCompare(a.date)))}</div>`}
else if(page==='progress'){const fran=records.filter(r=>r.title==='Fran'&&r.rx&&r.minutes!=null),best=fran.slice().sort((a,b)=>(+a.minutes*60 + +a.seconds)-(+b.minutes*60 + +b.seconds))[0];main.innerHTML=`<div class="intro"><div class="eyebrow">PROGRESS</div><h1>나의 성장</h1><p>어제의 나와 비교하는, 나만의 페이스.</p></div><section class="card"><div class="row"><h2>Fran 최고 기록</h2><span class="tag">Rx</span></div><div class="metric" style="margin-top:20px">${best?score(best):'—'}</div><p class="hint">완료 시간 · 짧을수록 좋은 기록</p><details><summary>비교 기준 보기</summary><p>같은 WOD와 같은 처방으로 수행한 Rx 기록만 비교해요. 조정한 운동은 기록에서 따로 확인할 수 있어요.</p></details></section><h2 class="section-title">최근 7일 운동 빈도</h2><section class="card"><div class="metric">${new Set(records.filter(r=>r.date>='2026-11-22'&&r.date<=referenceDate).map(r=>r.date)).size}<small>일 운동</small></div><div class="bars" aria-hidden="true">${Array.from({length:7},(_,i)=>`<div class="bar ${i===6?'current':''}" style="height:${records.some(r=>r.date==='2026-11-'+(22+i))?80:8}px"></div>`).join('')}</div><div class="row sub"><span>11월 22일</span><span>11월 28일</span></div><p class="hint">기록이 있는 날짜를 하루로 계산해요.</p></section>`}
else if(page==='editor')renderEditor();}
function filterHistory(q){const result=records.filter(r=>r.title.toLowerCase().includes(q.toLowerCase())).sort((a,b)=>b.date.localeCompare(a.date));$('#history-list').innerHTML=recordList(result);$('#count').textContent=result.length+'회'}
function startWorkout(){draft={date:selectedDate,title:'Fran',minutes:'',seconds:'',rx:true,note:'',strength:null};navigate('editor')}
function renderEditor(){$('#main').innerHTML=`<div class="row editor-head"><button class="icon back" aria-label="작성 나가기" onclick="openSheet('leave')">${icon('back')}</button><h2>운동 기록</h2><button class="icon" aria-label="기록 작성 옵션" onclick="openSheet('editor-options')">${icon('more')}</button></div><form id="workout-form" onsubmit="saveWorkout(event)" oninput="if($('#minutes'))$('#minutes').setCustomValidity('')"><p class="eyebrow">${dateText(draft.date)}</p><div class="row"><h1>${escapeHtml(draft.title)}</h1><button type="button" class="text-button" onclick="captureDraft();openSheet('library')">운동 변경</button></div><p class="hint">${draft.title==='Fran'?'21–15–9회 · 스러스터 + 풀업':draft.title==='Cindy'?'20분 · 풀업 5 + 푸시업 10 + 스쿼트 15':'오늘 수행한 운동의 결과를 남겨요.'}</p><section class="card" style="margin-top:24px"><h2>${draft.title==='Cindy'?'완료 라운드':'완료 시간'}</h2><p class="hint">${draft.title==='Cindy'?'20분 동안 완료한 라운드 수':'운동을 마치는 데 걸린 시간'}</p>${draft.title==='Cindy'?`<div class="field"><label for="rounds">라운드</label><input id="rounds" required type="number" min="1" max="999" step="1" inputmode="numeric" value="${escapeHtml(draft.rounds||'')}" placeholder="0"></div>`:`<div class="two field"><div><label for="minutes">분</label><input class="score-input" id="minutes" required type="number" min="0" max="999" step="1" inputmode="numeric" placeholder="00" value="${escapeHtml(draft.minutes)}"></div><div><label for="seconds">초</label><input class="score-input" id="seconds" required type="number" min="0" max="59" step="1" inputmode="numeric" placeholder="00" value="${escapeHtml(draft.seconds)}"></div></div>`}<div class="field"><label for="level">수행 방식</label><select id="level"><option value="rx" ${draft.rx?'selected':''}>Rx · 처방대로 수행</option><option value="scaled" ${!draft.rx?'selected':''}>Scaled · 중량 또는 동작 조정</option></select></div></section><details><summary>운동 처방 보기</summary><p>${draft.title==='Fran'?'21–15–9회 스러스터와 풀업을 순서대로 완료해요. 스러스터 처방은 95/65 lb (약 43/29 kg)예요.':draft.title==='Cindy'?'20분 동안 풀업 5회, 푸시업 10회, 에어 스쿼트 15회를 반복해요.':'자유 운동은 비교 가능한 벤치마크 기록에 포함하지 않아요.'}</p></details><details ${draft.note||draft.strength?'open':''}><summary>메모와 근력 세트 추가</summary><label for="note">운동 메모</label><textarea id="note" placeholder="컨디션이나 조정한 동작을 남겨요">${escapeHtml(draft.note)}</textarea><div class="field"><label class="checkrow"><input type="checkbox" id="strength-enabled" ${draft.strength?'checked':''} onchange="$('#strength-fields').classList.toggle('hidden',!this.checked);$('#strength-fields').querySelectorAll('input,select').forEach(input=>input.disabled=!this.checked)">근력 세트도 기록</label><div id="strength-fields" class="${draft.strength?'':'hidden'}"><label for="movement">동작</label><select id="movement" ${draft.strength?'':'disabled'}><option>백 스쿼트</option><option>데드리프트</option><option>프런트 스쿼트</option></select><div class="two field"><div><label for="reps">반복 횟수</label><input id="reps" ${draft.strength?'':'disabled'} required type="number" min="1" max="999" inputmode="numeric" value="${draft.strength?.reps||5}"></div><div><label for="weight">중량 (${unit})</label><input id="weight" ${draft.strength?'':'disabled'} required type="number" min="0" max="9999" step="0.5" inputmode="decimal" value="${draft.strength?.weight||60}"></div></div><p class="hint">이 목업에서는 근력 1세트를 함께 기록해요.</p></div></div></details><div class="editor-footer"><button type="submit" class="primary">기록 저장하기</button><p class="notice">이 브라우저에 저장돼요 · 앱과 동기화되지 않아요</p></div></form>`;if(draft.strength)$('#movement').value=draft.strength.movement}
function captureDraft(){if(!$('#workout-form'))return;draft.minutes=$('#minutes')?.value||'';draft.seconds=$('#seconds')?.value||'';draft.rounds=$('#rounds')?.value;draft.rx=$('#level').value==='rx';draft.note=$('#note').value;draft.strength=$('#strength-enabled').checked?{movement:$('#movement').value,reps:$('#reps').value,weight:$('#weight').value,unit}:null}
function saveWorkout(e){e.preventDefault();captureDraft();if(draft.title!=='Cindy'&&+draft.minutes===0&&+draft.seconds===0){$('#minutes').setCustomValidity('완료 시간을 1초 이상 입력해주세요.');$('#minutes').reportValidity();$('#minutes').oninput=()=>$('#minutes').setCustomValidity('');return}records.unshift({...draft,id:Date.now()});selectedDate=draft.date;const saved=persist();draft=null;navigate('today');toast(saved?'운동 기록을 저장했어요':'이번 화면에 저장했어요 · 브라우저 저장 불가')}
function toast(text){$('#toast').textContent=text;$('#toast').classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),3500)}
function closeSheet(){$('#sheet').close();returnFocus?.focus()}
function openSheet(kind){returnFocus=document.activeElement;let title='',body='';if(kind==='menu'){title='더 보기';body=`<button class="menu-item" onclick="closeSheet();navigate('progress')">${icon('chart')}<span>성장<small>최고 기록과 운동 빈도</small></span>${icon('arrow','chevron')}</button><button class="menu-item" onclick="openSheet('settings')"><span>설정<small>중량 단위와 저장 정보</small></span>${icon('arrow','chevron')}</button>`}else if(kind==='settings'){title='설정';body=`<label for="unit">중량 단위</label><select id="unit" onchange="unit=this.value;persist();toast('중량 단위를 변경했어요')"><option value="kg" ${unit==='kg'?'selected':''}>킬로그램 (kg)</option><option value="lb" ${unit==='lb'?'selected':''}>파운드 (lb)</option></select><div class="section-title"><h3>기기 내 저장</h3><p class="hint">목업의 기록은 이 브라우저에만 저장돼요. 실제 앱 기록과 분리되어 있으며, 브라우저 데이터를 지우면 사라져요.</p></div><div class="row"><span>언어</span><span class="setting-value">한국어</span></div>`}else if(kind==='date'){title='운동 날짜';body=`<label for="date">기록할 날짜</label><input id="date" type="date" value="${selectedDate}" max="${referenceDate}"><p class="hint">지난 운동도 날짜를 골라 기록할 수 있어요.</p><button class="primary" style="margin-top:24px" onclick="chooseDate()">이 날짜 보기</button>`}else if(kind==='library'){title='운동 선택';body=['Fran','Cindy','자유 운동'].map(name=>`<button class="menu-item" onclick="chooseWorkout('${name}')"><span>${name}<small>${name==='Fran'?'완료 시간 · 21–15–9':name==='Cindy'?'라운드 수 · 20분':'직접 이름을 정하고 시간 기록'}</small></span>${icon('arrow','chevron')}</button>`).join('')}else if(kind==='editor-options'){title='기록 작성 옵션';body=`<button class="menu-item" onclick="captureDraft();openSheet('library')"><span>운동 변경</span>${icon('arrow','chevron')}</button><button class="menu-item" onclick="openSheet('leave')"><span>작성 나가기</span>${icon('arrow','chevron')}</button>`}else if(kind==='leave'){title='작성을 나갈까요?';body=`<p class="hint">저장하지 않은 입력은 사라져요.</p><button class="primary" style="margin-top:24px" onclick="closeSheet()">계속 작성하기</button><button class="menu-item" onclick="closeSheet();draft=null;navigate('today')"><span>입력 버리고 나가기</span></button>`}$('#sheet-title').textContent=title;$('#sheet-body').innerHTML=body;if(!$('#sheet').open)$('#sheet').showModal()}
function chooseDate(){const input=$('#date');if(!input.value||!input.checkValidity()){input.reportValidity();return}selectedDate=input.value;closeSheet();navigate('today')}
function chooseWorkout(name){draft.title=name;draft.minutes='';draft.seconds='';draft.rounds='';if(name==='자유 운동'){$('#sheet-title').textContent='자유 운동';$('#sheet-body').innerHTML='<form onsubmit="event.preventDefault();draft.title=$(\'#custom-name\').value.trim()||\'자유 운동\';closeSheet();renderEditor()"><label for="custom-name">운동 이름</label><input id="custom-name" required maxlength="60" placeholder="예: 토요일 WOD"><button class="primary" style="margin-top:24px">이 운동 기록하기</button></form>';return}closeSheet();renderEditor()}
function showRecord(id){const r=records.find(x=>x.id===id);returnFocus=document.activeElement;$('#sheet-title').textContent=r.title;$('#sheet-body').innerHTML=`<p class="sub">${dateText(r.date)} · ${r.rx?'Rx · 처방대로':'Scaled · 조정'}</p><div class="metric" style="margin-top:20px">${escapeHtml(score(r))}</div><p class="hint">${r.rounds!=null?'완료 라운드':'완료 시간'}</p>${r.strength?`<h3 class="section-title">근력 세트</h3><p>${escapeHtml(r.strength.movement)} · ${escapeHtml(r.strength.reps)}회 × ${escapeHtml(r.strength.weight)} ${escapeHtml(r.strength.unit)}</p>`:''}<h3 class="section-title">운동 메모</h3><p style="white-space:pre-wrap">${escapeHtml(r.note||'남긴 메모가 없어요.')}</p>`;$('#sheet').showModal()}
$('#sheet').addEventListener('click',e=>{if(e.target===$('#sheet'))closeSheet()});render();
</script>
</body>
</html>

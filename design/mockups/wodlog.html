/* Translucent controls float above the scrolling workout content. */
:root{

}

function localize(root) {
  if (locale!=="en") return;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  while (walker.nextNode()) {
    const node=walker.currentNode;
    const text=node.textContent.trim();
    if (english[text]) node.textContent=node.textContent.replace(text,english[text]);
  }
  for (const node of root.querySelectorAll("[placeholder],[aria-label]")) {
    for (const attribute of ["placeholder","aria-label"]) {
      if (node.hasAttribute(attribute)) node.setAttribute(attribute,tr(node.getAttribute(attribute)));
    }
  }
}

      kg=Number(match[1].replace(",","."))/(match[2].toLowerCase().startsWith("lb")||match[2].toLowerCase().startsWith("pound")?poundsPerKg:1);
      line=line.replace(match[0]," ").trim();
    }
  }
  const target=/\b(\d+(?:[.,]\d+)?\s*-?\s*(?:feet|foot|ft|inches?|inch|in|cm|m)\s+(?:target|box)(?:\s+height)?)(?:\b|$)/i.exec(line);
  if (target) {
    notes.push(target[1]);
    line=line.replace(target[0]," ").trim();
  }
  const lineLadder=repetitionLadder.exec(line);
  const maximum=/^max(?:imum)?\s+(?:(?:reps?)\s+(?:of\s+)?)?/i.exec(line);
  const quantity=lineLadder||maximum?null:quantityPattern.exec(line);
  let amount=ladder??"";
  let unit="reps";
  if (lineLadder) {
    amount=lineLadder[1].replace(/\s+/g,"");
    line=line.slice(lineLadder[0].length);
  } else if (maximum) {
    amount="Max";
    line=line.slice(maximum[0].length);
  } else if (quantity) {
    amount=quantity[1].replace(",",".");
    line=quantity[3];
    const measure=(quantity[2]??"reps").toLowerCase();
    const unitPatterns=[["km",/^k(?:m|ilomet)/],["mi",/^(?:mi$|mile)/],["m",/^(?:m$|met)/],
      ["ft",/^(?:ft|foot|feet)/],["cal",/^cal/],["sec",/^sec/],["min",/^min/]];
    unit=unitPatterns.find(([,pattern])=>pattern.test(measure))?.[0]??"reps";
  }
  const stem=line.replace(/^\s*(?:x|×|reps?\s+of|of)\s+/i,"").replace(/[\s:().,]+$/g,"").trim();
  const name=ingestMoves.get(foldedMove(stem));
  if (!name || !amount || ambiguous) return null;
  return {name,amount,unit,kg,standard:notes.join(" · ")};
}

function parseWodText(raw) {
  const lines=raw.normalize("NFKC").replace(/[–—−]/g,"-").replace(/\r\n?/g,"\n").split("\n")
    .flatMap(line=>line.split(/\.\s+(?=(?:Minute|Station)\s+\d+\s*:)/i))
    .map(line=>line.trim()).filter(Boolean);
  const draft={name:"",format:"",structure:"",minutes:0,scale:"",scoreKind:"",moves:[],review:[],needsVariant:false};
  let ladder="";
  let parsedMain=false;
  let secondary=false;
  for (const line of lines) {
    if (sectionStop.test(line)) break;
    if (/^compare to\b/i.test(line)) continue;
    const alternative=alternativeHeading.exec(line);
    if (alternative) {
      if (draft.format || parsedMain) break;
      draft.scale=/^foundations$/i.test(alternative[1])?"Foundations":"Scaled";
      draft.review.push(line);
      draft.needsVariant=true;
      continue;
    }
    if (parsedMain && sectionSplit.test(line)) secondary=true;
    if (secondary) { draft.review.push(line); continue; }
    if (/^(?:(?:Mon|Tues|Wednes|Thurs|Fri|Satur|Sun)day\s+\d{6}|\d{6})$/i.test(line)) {
      draft.name ||= "WOD "+line.match(/\d{6}/)[0];
      continue;
    }
    const division=explicitDivision.exec(line);
    if (division) {
      draft.scale=division[1].toLowerCase().startsWith("rx")?"Rx":/^scaled$/i.test(division[1])?"Scaled":"Foundations";
      continue;
    }
    if (divisionLine.test(line)) {
      draft.needsVariant=true;
      draft.review.push(line);
      continue;
    }
    if (/^post\b/i.test(line)) {
      if (/\btotal\b.*\breps\b/i.test(line) && ["EMOM","E2MOM","Intervals"].includes(draft.format)) draft.scoreKind="reps";
      if (/\b(?:load|weight)\b/i.test(line) && ["EMOM","E2MOM"].includes(draft.format) && !draft.scoreKind) draft.scoreKind="load";
      continue;
    }
    const cap=capPattern.exec(line)??/(\d+(?:[.,]\d+)?)\s*-?\s*(?:min(?:ute)?s?|분)\s+(?:time\s*)?cap\b/i.exec(line);
    if (cap) {
      draft.minutes=Number(cap[1].replace(",","."))+Number(cap[2]??0)/60;
      if (/^(?:time\s*cap|타임캡|제한\s*시간|\d+\s*-?\s*min(?:ute)?s?\s+(?:time\s*)?cap)\b/i.test(line)) continue;
    }
    const interval=/^every\s+(\d+)\s+minutes?\b/i.exec(line);
    const rounds=/^(\d+)\s+rounds?\b/i.exec(line);
    let format="";
    if (/^(?:tabata\b)/i.test(line)) format="Tabata";
    else if (/\bAMRAP\b|^complete\s+as\s+many\s+(?:rounds?|reps?)/i.test(line)) format="AMRAP";
    else if (/\bE2MOM\b/i.test(line) || Number(interval?.[1])===2) format="E2MOM";
    else if (/\bEMOM\b|^every\s+minute\s+on\s+the\s+minute/i.test(line) || Number(interval?.[1])===1) format="EMOM";
    else if (interval || (rounds && /max reps|each for time/i.test(line))) format="Intervals";
    else if (/\bfor time\b/i.test(line) || /\bRFT\b/i.test(line)) format=rounds||/\bRFT\b/i.test(line)?"RFT":"For Time";
    else if (/^(?:for\s+)?max(?:imum)?\s+(?:load|weight)\b/i.test(line)) format="Max Load";
    else if (/^(?:for\s+)?max(?:imum)?\s+reps\b/i.test(line)) format="Max Reps";
    else if (/^for\s+distance\b/i.test(line)) format="For Distance";
    else if (/^for\s+calories\b/i.test(line)) format="For Calories";
    let lineForMove=line;
    if (format) {
      if (draft.format && (parsedMain || draft.format!==format)) {
        secondary=true;
        draft.review.push(line);
        continue;
      }
      draft.format=format;
      draft.structure=line.split(/:\s+(?=\d|[A-Za-z])/)[0].replace(/:$/,"");
      ladder=repetitionLadder.exec(line)?.[1]?.replace(/\s+/g,"")??"";
      const duration=minutesAfter.exec(line)??minutesBefore.exec(line)??durationSuffix.exec(line);
      if (duration && !cap && !draft.minutes) draft.minutes=Number(duration[1].replace(",","."));
      if (format==="Intervals" && /max reps/i.test(line)) draft.scoreKind="points";
      const inline=line.replace(/^.*?:\s*/,"");
      if (inline===line || !inline) continue;
      lineForMove=inline;
    } else if (/^\d+(?:\s*-\s*\d+)+\s*:?$/.test(line) && !parsedMain) {
      ladder=line.replace(/[\s:]/g,"");
      draft.structure ||= ladder;
      continue;
    } else if (rounds && /^(\d+)\s+rounds?\s*:?$/i.test(line) && !parsedMain && !draft.structure) {
      draft.structure=line.replace(/:$/,"");
      continue;
    } else if (!parsedMain && benchmarks.some(item=>item.name.toLowerCase()===line.toLowerCase())) {
      draft.name=benchmarks.find(item=>item.name.toLowerCase()===line.toLowerCase()).name;
      continue;
    } else if (!parsedMain && /^(?:CrossFit\s+)?(?:Open\s+Workout|Open)\s+\d{2}\.\d+\b/i.test(line)) {
      draft.name=line;
      continue;
    }
    const moves=lineForMove.split(/\s+[·•]\s+|\s*;\s*/).map(part=>readMovementLine(part,ladder));
    if (moves.some(Boolean)) {
      draft.moves.push(...moves.filter(Boolean));
      parsedMain=true;
      if (moves.some(move=>!move)) draft.review.push(line);
    } else draft.review.push(line);
  }
  if (draft.minutes>180) {
    draft.minutes=0;
    draft.review.push(...lines.filter(line=>capPattern.test(line)||minutesAfter.test(line)));
  }
  return draft;
}

function benchmarkDraft(item) {
  const parsed=parseWodText(item.plan);
  let moves=parsed.moves;
  if (item.name==="Fight Gone Bad") {
    moves=["Wall-ball Shot","Sumo Deadlift High Pull","Box Jump","Push Press","Row"].map(name=>({name,amount:"1",unit:"min",kg:null,standard:""}));
  } else if (item.name==="Tabata This!") {
    moves=["Air Squat","Row","Pull-Up","Sit-Up","Push-Up"].map(name=>({name,amount:"20",unit:"sec",kg:null,standard:"8 intervals"}));
  }
  return {...item,structure:parsed.structure,moves,scoreKind:item.scoreKind||parsed.scoreKind};
}

function sourceLevels(raw) {
  const common=[], levels=[];
  let active=null;
  for (const line of raw.split(/\r?\n/)) {
    const heading=/^\s*(Rx(?:['’]d)?(?:\s*\+)?|Scaled|Foundations?|Intermediate|Beginner|Advanced|Level\s*\d+|레벨\s*\d+)(?:\s+(?:option|workout))?\s*:?\s*$/i.exec(line);
    if (heading) {
      active={label:heading[1],lines:[]};
      levels.push(active);
    } else (active?.lines??common).push(line);
  }
  return {common,levels:levels.filter(level=>level.lines.some(line=>line.trim()))};
}

function applyWodImport() {
  const form=document.querySelector("#record-form");
  const fields=form.elements;
  const raw=fields["wod-source"].value.trim();
  if (!raw) { renderImportStatus("WOD 원문을 붙여넣어 주세요."); return; }
  const {common,levels}=sourceLevels(raw);
  const level=levels[Number(fields["source-level"].value)];
  if (levels.length && (fields["source-level"].value===""||!level)) {
    renderImportStatus("수행한 레벨을 먼저 선택해 주세요.");
    return;
  }
  if (fields["applied-level"].value && fields["applied-level"].value!==level?.label) {
    renderImportStatus("수행한 레벨을 변경하려면 입력을 취소하고 다시 시작해 주세요.");
    return;
  }
  const draft=parseWodText(level?level.lines.join("\n"):raw);
  if (level) {
    const title=parseWodText(common.join("\n")).name;
    draft.name ||= title;
    draft.scale=/^rx/i.test(level.label)?"Rx":/^foundation/i.test(level.label)?"Foundations":"Scaled";
    fields["applied-level"].value=level.label;
    if (!fields.variant.value.trim()) fields.variant.value=level.label;
  }
  const hadScore=[...form.querySelectorAll('#score-fields input')].some(input=>input.value && input.name!=="extra");
  const format=draft.format||fields.format.value;
  if (draft.name && !fields.name.value.trim()) fields.name.value=draft.name;
  if (draft.scale) fields.scale.value=draft.scale;
  if (draft.structure && !fields.structure.value.trim()) fields.structure.value=draft.structure;
  if (draft.minutes && !fields.minutes.value) fields.minutes.value=String(draft.minutes);
  if (draft.review.length) {
    const plan=fields.plan.value.trim();
    const additions=draft.review.filter(line=>!plan.split("\n").includes(line));
    fields.plan.value=[plan,...new Set(additions)].filter(Boolean).join("\n");
  }
  if (!hadScore && (draft.format||draft.scoreKind)) {
    fields.format.value=format;
    document.querySelector("#score-fields").innerHTML=scoreInputs(format,draft.scoreKind);
  }
  const moves=document.querySelector("#moves");
  const current=new Map();
  for (const fieldset of moves.querySelectorAll("fieldset")) {
    const identity=JSON.stringify(["name","amount","unit","load","standard","equipment"].map(key=>fieldset.querySelector('[name="move-'+key+'"]').value.trim()));
    current.set(identity,(current.get(identity)??0)+1);
  }
  for (const move of draft.moves) {
    const load=move.kg===null?"":String(Number((move.kg*(data.unit==="lb"?poundsPerKg:1)).toFixed(4)));
    const identity=JSON.stringify([move.name,move.amount,move.unit,load,move.standard,move.equipment??""]);
    if (current.get(identity)>0) {
      current.set(identity,current.get(identity)-1);
      continue;
    }
    moves.insertAdjacentHTML("beforeend",movementFields(move));
  }
  refreshMovementOrder();
  fields["applied-source"].value=raw;
  togglePendingScore();
  fields["needs-variant"].value=fields["needs-variant"].value==="yes"||draft.needsVariant?"yes":"";
  const notes=[];
  if (!draft.format) notes.push(tr("운동 방식을 확인해 주세요."));
  if (!draft.moves.length) notes.push(tr("자동으로 읽은 동작이 없어요. 공통 구성을 확인해 주세요."));
  if (draft.review.length) notes.push(tr("해석이 필요한 줄은 공통 구성에 남겼어요."));
  if (draft.needsVariant) notes.push(tr("중량·타깃 기준 중 실제 적용한 값을 적어 주세요."));
  if (hadScore && draft.format && format!==fields.format.value) notes.push(tr("입력한 스코어를 유지했어요. 운동 방식을 확인해 주세요."));
  renderImportStatus(tr("초안을 채웠어요. 확인하고 수정한 뒤 기록을 저장하세요.")+(notes.length?" "+notes.join(" "):""));
}
function validData(value) {
  return value && ["kg","lb"].includes(value.unit) && Number.isInteger(value.goal) && value.goal>=1 && value.goal<=7 &&
    Array.isArray(value.records) && new Set(value.records.map(record=>record?.id)).size === value.records.length &&
    value.records.every(record => record && typeof record.id==="string" && typeof record.name==="string" && typeof record.note==="string" &&
      /^\d{4}-\d{2}-\d{2}$/.test(record.date) && !Number.isNaN(Date.parse(record.date)) &&
      (record.type==="strength" ? Array.isArray(record.sets) && record.sets.length &&
        record.sets.every(set=>set && Number.isFinite(set.weight) && set.weight>=0 && Number.isInteger(set.reps) && set.reps>0 &&
          (set.rpe===null || (Number.isFinite(set.rpe) && set.rpe>=1 && set.rpe<=10))) :
        record.type==="wod" && wodFormats.includes(record.format) &&
        scales.includes(record.scale) && typeof record.plan==="string" &&
        typeof record.score==="string" && Number.isFinite(record.minutes) && record.minutes>=0 && record.minutes<=180));
}
function hydrateBenchmarkRecords(records) {
  for (const record of records) {
    if (record.type!=="wod" || record.moves?.length || record.sourceText) continue;
    const plan=oldBenchmarkPlans.get(record.plan)??record.plan;
    const item=benchmarks.find(item=>item.name===record.name && item.plan===plan && item.format===record.format);
    if (!item) continue;
    const template=benchmarkDraft(item);
    record.plan=plan;
    record.moves=template.moves;
    record.structure ||= template.structure;
  }
  return records;
}

function load() {
  try {
    const value = JSON.parse(localStorage.getItem(storageKey));
    if (validData(value)) return {...value,records:hydrateBenchmarkRecords(value.records)};
  } catch {}
  return {...starter,records:hydrateBenchmarkRecords(structuredClone(starter.records))};
}

function progressPage() {

  const relevant = records.filter(record=>record.name===selected);
  const strength = relevant.filter(record=>record.type==="strength");
  const previous = strength[1];
  const latest = strength[0];
  const best = strength.length ? Math.max(...strength.flatMap(record=>record.sets.map(set=>set.weight))) : 0;
  const delta = previous ? volume(latest)-volume(previous) : null;
  const totals = new Map();
  for (const record of records.filter(record=>record.type==="strength" && record.date>=dateKey(ago(13)) && record.date<=todayKey)) {
    const group = catalog.find(item=>item[0]===record.name)?.[1] ?? "직접 추가";
    const pair = totals.get(group) ?? [0,0];
    pair[record.date>=dateKey(ago(6))?0:1] += volume(record);
    totals.set(group,pair);
  }
  return top("운동 통계","진행 상황")+

    (latest?strengthRecords(strength):"")+
    '<section class="section columns"><div><div class="section-head"><h2>운동 추이</h2></div><div class="card">'+recordRows(relevant.slice(0,8))+'</div></div>'+
    '<div><div class="section-head"><h2>동작 그룹별 볼륨</h2></div><div class="card">'+([...totals].map(([group,[current,prior]])=>
      '<div class="chart"><b>'+escapeHtml(tr(group))+'</b><progress value="'+current+'" max="'+Math.max(current,prior,1)+'" aria-label="'+escapeHtml(group)+(locale==="en"?' volume over the last seven days':' 최근 7일 볼륨')+'"></progress><p class="hint">'+tr("최근 7일")+' '+weight(current)+' · '+tr("직전 7일")+' '+weight(prior)+'</p></div>').join("") || '<p class="empty">최근 14일에 기록한 근력 운동이 없어요.</p>')+'</div></div></section>';

function fitEditorToViewport() {
  const viewport = window.visualViewport;
  const editing = dialog.open && dialog.querySelector("#record-form");
  if (!viewport || !editing || viewport.scale!==1) {
    dialog.classList.remove("editor-keyboard","editor-keyboard-short");
    dialog.style.removeProperty("--keyboard-inset");
    dialog.style.removeProperty("--editor-viewport");
    return;
  }
  const inset=Math.max(0,innerHeight-viewport.height-viewport.offsetTop);
  dialog.classList.toggle("editor-keyboard",inset>0);
  dialog.classList.toggle("editor-keyboard-short",inset>0 && viewport.height<300);
  dialog.style.setProperty("--keyboard-inset",inset+"px");
  dialog.style.setProperty("--editor-viewport",viewport.height+"px");
  const focused=document.activeElement;
  if (inset>0 && dialogBody.contains(focused) && focused.matches("input,textarea,select")) {
    const input=focused.getBoundingClientRect();
    const body=dialogBody.getBoundingClientRect();
    const gap=6;
    if (input.bottom>body.bottom-gap) dialogBody.scrollTop+=input.bottom-body.bottom+gap;
    else if (input.top<body.top+gap) dialogBody.scrollTop-=body.top-input.top+gap;
  }
}

      (record.needsVariant?'<p class="hint wide">'+tr("원문에 여러 수행 기준이 있어요. PR 비교를 위해 실제 수행 조건을 적어 주세요.")+'</p>':"")+
      '<label class="wide">라운드·구간 구성<input name="structure" value="'+escapeHtml(record.structure)+'" placeholder="예: 5 rounds / Every 2 min × 6"></label>'+
      '<label class="wide">공통 구성<textarea name="plan" rows="2" placeholder="동작 또는 21-15-9, 라운드 구성, 타깃 높이 등을 적어주세요.">'+escapeHtml(record.plan)+'</textarea></label>'+
      '<div class="wide stack" id="moves">'+(record.moves??[]).map(movementFields).join("")+'</div>'+
      '<div class="wide"><button class="secondary" type="button" data-action="add-move">＋ 동작 추가</button></div><div class="wide" id="movement-picker-host"></div>'+
      '<label class="wide">타임캡·제한 시간 (분)<input name="minutes" type="number" inputmode="decimal" min="0.016" max="180" step="any" value="'+(record.minutes||"")+'"></label>'+
      '<label class="wide pending-score"><input type="checkbox" name="score-pending" '+(record.waitingForScore?"checked":"")+'>'+tr("스코어는 나중에 입력")+'</label>'+
      '<div class="wide form-grid score-fields" id="score-fields">'+scoreInputs(record.format??"For Time",record.scoreKind??measures(record)?.kind,measures(record),record.score)+'</div>'+
      '<p class="hint wide">구성과 수행 조건을 입력해 두면 다시 했을 때 PR을 비교할 수 있어요.</p>')+
    '<label class="wide">메모<textarea name="note" rows="2" placeholder="컨디션, 동작 수정, 다음 목표">'+escapeHtml(record.note)+'</textarea></label>'+
    '</div></form>',
    '<button class="primary" type="submit" form="record-form">기록 저장</button><button type="button" class="quiet" data-action="close">취소</button>');
  if (!strength) { showSourceLevels(); togglePendingScore(); refreshMovementOrder(); }
}
function showBenchmarks() {
  show("벤치마크 WOD",'<div class="card">'+benchmarks.map((item,index)=>
    '<button class="row" data-action="preset" data-id="'+index+'"><span class="icon purple" aria-hidden="true">↯</span><span><b>'+item.name+'</b><span class="hint">'+item.format+' · '+escapeHtml(item.plan.replaceAll("\n"," / "))+'</span></span><span class="end">›</span></button>').join("")+'</div>');
}
function detail(record) {
  const strength = record.type==="strength";
  show(record.name,'<p class="hint">'+fullDate(record.date)+' · '+(strength?tr("근력"):escapeHtml(tr(record.format)+" · "+tr(record.scale)))+'</p>'+
    '<div class="section card">'+(strength?record.sets.map((set,i)=>'<div class="row"><b>'+ (locale==="en"?"Set "+(i+1):(i+1)+"세트")+'</b><span class="end">'+weight(set.weight)+' × '+set.reps+(set.rpe===null?"":" · RPE "+set.rpe)+'</span></div>').join(""):
    '<h3>'+escapeHtml(scoreText(record))+' '+(getPRs().improvements.has(record.id)?prBadge:"")+'</h3>'+
    '<p class="hint">'+escapeHtml(record.variant)+'</p><p style="white-space:pre-wrap">'+escapeHtml([record.structure,record.plan].filter(Boolean).join("\n"))+'</p>'+
    (record.moves??[]).map(move=>'<div class="row"><b>'+escapeHtml(move.name)+'</b><span class="end">'+escapeHtml(move.amount+" "+move.unit+(move.kg===null?"":" · "+weight(move.kg))+(move.standard?" · "+move.standard:"")+(move.equipment?" · "+move.equipment:""))+'</span></div>').join(""))+
    '</div>'+(record.note?'<p class="section" style="white-space:pre-wrap">'+escapeHtml(record.note)+'</p>':"")+
    '<div class="actions"><button class="primary" data-action="edit" data-id="'+escapeHtml(record.id)+'">수정</button>'+
    (strength?"":'<button class="secondary" data-action="retry" data-id="'+escapeHtml(record.id)+'">다시 기록</button>')+
    '<button class="danger" data-action="delete" data-id="'+escapeHtml(record.id)+'">삭제</button></div>');
}
function repeatWods() {
  const recent=new Map();
  for (const record of sorted().filter(record=>record.type==="wod")) {
    const key=wodKey(record)??record.id;
    if (!recent.has(key)) recent.set(key,record);
  }
  show("지난 WOD 다시 하기",'<div class="card">'+recordRows([...recent.values()]).replaceAll('data-action="detail"','data-action="retry"')+'</div>');
}
const expandedPRGroups=new Set();
document.addEventListener("toggle",event=>{
  const group=event.target;
  if (!group.isConnected || !group.matches("details[data-pr-group]")) return;
  if (group.open) expandedPRGroups.add(group.dataset.prGroup);
  else expandedPRGroups.delete(group.dataset.prGroup);
},true);
function prGroups() {
  const {best,improvements}=getPRs();
  const records=sorted().filter(record=>record.type==="wod");
  return best.length?best.map(record=>{
      const key=wodKey(record);
      const attempts=records.filter(attempt=>wodKey(attempt)===key);
      const improved=attempts.filter(attempt=>improvements.has(attempt.id));
      return '<details class="section card pr-group" data-pr-group="'+escapeHtml(key)+'" '+(expandedPRGroups.has(key)?"open":"")+'><summary><strong>'+escapeHtml(record.name)+'</strong><span>'+
        escapeHtml(tr(record.scale)+" · "+scoreText(record))+'</span></summary>'+
        '<section class="section"><h3>'+tr("현재 최고 기록")+'</h3>'+recordRows([record])+'</section>'+
        '<section class="section"><h3>'+tr("PR 갱신 이력")+'</h3>'+
        (improved.length?recordRows(improved):'<p class="hint">'+tr("아직 갱신한 PR이 없어요.")+'</p>')+'</section>'+
        '<section class="section"><h3>'+tr("같은 조건의 전체 스코어")+'</h3>'+recordRows(attempts)+'</section></details>';
    }).join(""):'<p class="empty">'+tr("비교 조건이 확인된 WOD 기록이 없어요.")+'</p>';
}
function prList() {
  show("와드 PR",'<p class="hint">같은 조건에서 최고 기록을 넘으면 PR 배지가 붙어요.</p>'+prGroups());
}
function scanMove(name) {
  const query=movementSearchKey(name);
  const exact=movementCatalog.find(([name])=>movementSearchKey(name)===query);
  return exact?.[0] ?? movementCatalog.find(([, ,aliases])=>aliases.some(alias=>movementSearchKey(alias)===query))?.[0] ?? name.trim();
}
function readWod(fields,record,form) {
  const read=name=>String(fields.get(name)??"").trim();
  const waitingForScore=fields.has("score-pending");
  const kind=waitingForScore?"text":read("score-kind");
  const value=kind==="time"?asSeconds(read("finish")):Number(read("value"))/(kind==="load"&&data.unit==="lb"?poundsPerKg:1);
  const extra=Number(read("extra"));
  const tie=asSeconds(read("tie"));
  const minutes=Number(read("minutes"));
  const finishExceedsCap=kind==="time" && minutes>0 && value>minutes*60;
  if (kind!=="text" && (!Number.isFinite(value)||value<0||
      (kind==="time" && (!value || finishExceedsCap)) ||
      (kind==="cap" && (!minutes || (read("tie") && (!tie||tie>minutes*60)))) ||
      (kind==="intervals" && (!extra||value>extra)) ||
      (read("format")==="AMRAP" && !minutes))) {
    notify(finishExceedsCap?"완주 시간이 타임캡을 초과했어요. 시간을 수정하거나 종료 상태를 바꿔 주세요.":"스코어와 제한 시간을 확인해 주세요.");
    const invalidName=kind==="time"?"finish":
      kind==="cap" && read("tie") && (!tie||tie>minutes*60) && minutes?"tie":
      !minutes && (kind==="cap" || read("format")==="AMRAP")?"minutes":
      kind==="intervals" && !extra?"extra":"value";
    const input=form.elements.namedItem(invalidName);
    input?.focus({preventScroll:true});
    input?.scrollIntoView({block:"nearest"});
    fitEditorToViewport();
    return false;
  }
  const names=fields.getAll("move-name");
  const amounts=fields.getAll("move-amount");
  const units=fields.getAll("move-unit");
  const loads=fields.getAll("move-load");
  const standards=fields.getAll("move-standard");
  const equipment=fields.getAll("move-equipment");
  const moves=names.map((name,i)=>({name:scanMove(name),amount:amounts[i].trim(),unit:units[i],
    kg:loads[i]===""?null:Number(loads[i])/(data.unit==="lb"?poundsPerKg:1),standard:standards[i].trim(),equipment:equipment[i].trim()}));
  if (moves.some(move=>!move.name||!move.amount|| (move.kg!==null && !Number.isFinite(move.kg)))) {
    notify("동작 이름과 수량을 입력해 주세요.");
    return false;
  }
  Object.assign(record,{format:read("format"),scale:read("scale"),variant:read("variant"),plan:read("plan"),structure:read("structure"),
    score:read("score"),minutes,moves,sourceText:read("applied-source"),sourceLevel:read("applied-level"),waitingForScore,needsVariant:read("needs-variant")==="yes",performance:kind==="text"?null:{kind,value,...(["rounds","intervals"].includes(kind)?{extra}:{}),...(tie?{tie}:{})}});
  return true;
}
function confirm(title, message, callback) {
  show(title,'<p>'+message+'</p><div class="actions"><button id="confirm" class="danger">확인</button><button class="quiet" data-action="close">취소</button></div>');
  document.querySelector("#confirm").onclick=callback;
}
function saveRecord(event) {
  event.preventDefault();
  const form = event.target;
  const fields = new FormData(form);
  const name = fields.get("name").trim();
  if (!name) { notify("운동 이름을 입력해 주세요."); return; }
  const record = {id:editRecord?.id??newId(),type:form.dataset.type,date:fields.get("date"),name,note:fields.get("note").trim()};
  if (record.type==="strength") {
    const reps=fields.getAll("reps");
    const rpe=fields.getAll("rpe");
    record.sets=fields.getAll("weight").map((value,i)=>({
      weight:Number(value)/(data.unit==="lb"?poundsPerKg:1),reps:Number(reps[i]),rpe:rpe[i]===""?null:Number(rpe[i])
    }));
  } else if (!readWod(fields,record,form)) return;
  const records = editRecord ? data.records.map(item=>item.id===record.id?record:item) : [...data.records,record];
  if (!validData({...data,records})) { notify("운동 기록의 입력값을 확인해 주세요."); return; }
  if (!store({...data,records})) return;
  day=record.date;
  dialog.close();
  render();
  if (getPRs().improvements.has(record.id)) {
    detail(record);
    document.querySelector("#dialog-title").textContent=tr("새 PR!")+" · "+record.name;
  } else {
    if (record.type==="wod") detail(record);
    notify("운동 기록을 저장했어요.");
  }
}
document.addEventListener("submit",event=>{if(event.target.id==="record-form") saveRecord(event);});
document.addEventListener("keydown",event=>{
  if (event.target.id==="movement-search" && event.key==="Enter" && !event.isComposing) event.preventDefault();
});
document.addEventListener("input",event=>{
  const field=event.target;
  if (field.id==="movement-search") updateMovementLibrary();
  if (field.name==="wod-source") showSourceLevels();
  if (field.id==="conversion-input") updateConversion();
  if (field.id==="search") {
    search=field.value;
    document.querySelector("#history-list").innerHTML=historyRows();
    localize(document.querySelector("#history-list"));
  }
  if (field.id==="exercise-name" && field.form.dataset.type==="strength") {
    const query=field.value.trim().toLowerCase();
    const matches=query?catalog.filter(item=>item.join(" ").toLowerCase().includes(query)).slice(0,5):[];
    document.querySelector("#exercise-matches").innerHTML=matches.map(item=>
      '<button type="button" class="secondary" data-action="exercise" data-id="'+escapeHtml(item[0])+'">'+escapeHtml(item[0])+'</button>').join(" ");
  }
});
document.addEventListener("change",event=>{
  const field=event.target;
  if (field.name==="score-pending") togglePendingScore();
  if (field.name==="format" || field.name==="score-kind") {
    const target=document.querySelector("#score-fields");
    target.innerHTML=scoreInputs(field.form.elements.format.value,field.name==="score-kind"?field.value:undefined);
    localize(target);
    togglePendingScore();
    if (field.name==="score-kind") target.querySelector('[name="score-kind"]').focus();
  }
  switch(field.id) {
    case "language":
      if (store({...data,locale:field.value})) { locale=field.value; render(); }
      break;
    case "type-filter":
      typeFilter=field.value;
      document.querySelector("#history-repeat").hidden=typeFilter==="strength";
      document.querySelector("#history-list").innerHTML=historyRows();
    localize(document.querySelector("#history-list"));
      break;
    case "progress-name": progressName=field.value; render(); break;
    case "goal": store({...data,goal:Number(field.value)}); render(); break;

  }
});
document.addEventListener("click",event=>{
  const button=event.target.closest("[data-action],[data-page]");
  if (!button) return;
  const {action,id,page}=button.dataset;
  if (page) { go(page); return; }
  const record=data.records.find(item=>item.id===id);
  switch(action) {
    case "unit":
      if (store({...data,unit:id})) {
        render();
        document.querySelector('[data-action="unit"][aria-pressed="true"]').focus();
      }
      break;
    case "calculator":
      conversionFrom="kg";
      conversionInput="";
      showCalculator();
      break;
    case "convert-direction":
      conversionFrom=id;
      showCalculator();
      document.querySelector('[data-action="convert-direction"][aria-pressed="true"]').focus();
      break;
    case "close": dialog.close(); break;
    case "repeat": repeatWods(); break;
    case "prs": prList(); break;
    case "movements": showMovementLibrary(); break;
    case "terms":
      show("WOD 용어",'<div class="card">'+terms.map(([term,definition])=>'<div class="row"><span><b>'+tr(term)+'</b><span class="hint">'+tr(definition)+'</span></span></div>').join("")+'</div>');
      break;
    case "retry":
      if (record) recordForm("wod",null,{...record,date:todayKey,repeat:true,score:"",scoreKind:measures(record)?.kind==="stopped"?"time":measures(record)?.kind,performance:null,note:""});
      break;
    case "add-move": openMovementPicker(null); break;
    case "browse-movement": openMovementPicker(button.closest("fieldset")); break;
    case "cancel-movement": {
      const focusTarget=movementTarget?.querySelector('[data-action="browse-movement"]')??document.querySelector('[data-action="add-move"]');
      closeMovementPicker();
      focusTarget.focus();
      break;
    }
    case "filter-movements":
      button.parentElement.querySelector('[aria-pressed="true"]').setAttribute("aria-pressed","false");
      button.setAttribute("aria-pressed","true");
      updateMovementLibrary();
      break;
    case "pick-movement": applyMovement(id); break;
    case "custom-move": applyMovement(""); break;
    case "move-up":
    case "move-down": {
      const row=button.closest("fieldset");
      const sibling=action==="move-up"?row.previousElementSibling:row.nextElementSibling;
      if (!sibling) break;
      if (action==="move-up") sibling.before(row);
      else sibling.after(row);
      refreshMovementOrder();
      (button.disabled?row.querySelector('[data-action="'+(action==="move-up"?"move-down":"move-up")+'"]'):button).focus();
      break;
    }
    case "remove-move": {
      const fieldset=button.closest("fieldset");
      if (fieldset===movementTarget) closeMovementPicker();
      fieldset.remove();
      refreshMovementOrder();
      break;
    }
    case "start": start(); break;
    case "strength": case "wod": recordForm(action); break;
    case "benchmarks": showBenchmarks(); break;
    case "preset": recordForm("wod",null,benchmarkDraft(benchmarks[Number(id)])); break;
    case "apply-wod-source": applyWodImport(); break;
    case "detail": if(record) detail(record); break;
    case "edit": if(record) recordForm(record.type,record); break;
    case "delete":
      confirm("운동 기록 삭제","이 운동 기록을 삭제할까요?",()=>{
        if (!store({...data,records:data.records.filter(item=>item.id!==id)})) return;
        dialog.close(); render(); notify("운동 기록을 삭제했어요.");
      }); break;
    case "exercise":
      document.querySelector("#exercise-name").value=id;
      document.querySelector("#exercise-matches").replaceChildren(); break;
    case "add-set":
      document.querySelector("#sets").insertAdjacentHTML("beforeend",setFields());
      document.querySelector(".set:last-child input").focus(); break;
    case "remove-set":
      if(document.querySelectorAll(".set").length>1) button.closest(".set").remove();
      else notify("세트를 한 개 이상 남겨주세요.");
      break;
    case "day": day=id; render(); break;
    case "choose-date":
      show("운동 날짜 선택",'<form id="date-form"><label>날짜<input type="date" name="day" value="'+day+'" required></label><div class="actions"><button class="primary">이 날짜 보기</button></div></form>');
      document.querySelector("#date-form").onsubmit = event=>{
        event.preventDefault(); day=new FormData(event.target).get("day"); dialog.close(); render();
      }; break;
    case "remove-demo":
      confirm("샘플 기록 삭제","시안에 포함된 샘플 기록을 지울까요?",()=>{
        if (!store({...data,records:data.records.filter(item=>!item.id.startsWith("demo-"))})) return;
        dialog.close(); render(); notify("샘플 기록을 지웠어요.");
      }); break;
  }
});
render();
})();
</script>
</body>
</html>

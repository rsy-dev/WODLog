<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f8faf8">
  <title>WODLog · 간단한 운동 기록</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #202923; background: #f4f6f4; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(860px, 100% - 32px); margin: 0 auto; padding: 28px 0 48px; }
    h1 { margin: 0 0 8px; font-size: 24px; letter-spacing: -.04em; }
    .intro { margin: 0 0 24px; color: #707971; font-size: 14px; }
    .screens { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    article { padding: 18px; border: 1px solid #e3e8e4; border-radius: 18px; background: #fff; }
    .label { margin: 0 0 16px; color: #778078; font-size: 12px; }
    .bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
    .brand { font-size: 16px; font-weight: 700; letter-spacing: -.03em; }
    .quiet { padding: 8px; border: 0; color: #59635b; background: transparent; font-size: 18px; }
    .date { margin: 0 0 8px; color: #727b73; font-size: 13px; }
    h2 { margin: 0 0 20px; font-size: 25px; letter-spacing: -.05em; }
    .empty { display: grid; min-height: 220px; place-content: center; text-align: center; color: #737d75; font-size: 14px; }
    .empty strong { margin-bottom: 6px; color: #303a32; font-size: 16px; font-weight: 600; }
    button.primary { width: 100%; min-height: 48px; border: 0; border-radius: 12px; color: #fff; background: #176b5b; font: inherit; font-size: 15px; font-weight: 600; }
    .row { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid #edf0ed; font-size: 15px; }
    .row small { display: block; margin-top: 4px; color: #7a837c; font-size: 12px; }
    .section { margin: 24px 0 8px; color: #788078; font-size: 12px; }
    .add { padding: 10px 0; border: 0; color: #176b5b; background: transparent; font: inherit; font-weight: 600; }
    .set { padding: 12px 0; border-bottom: 1px solid #edf0ed; font-size: 14px; }
    .set span { margin-left: 8px; color: #707971; }
    @media (max-width: 640px) { main { width: min(420px, 100% - 24px); padding-top: 20px; } .screens { grid-template-columns: 1fr; gap: 14px; } article { border-radius: 14px; } }
  </style>
</head>
<body>
  <main>
    <h1>WODLog</h1>
    <p class="intro">운동 기록에 필요한 화면만 남긴 미니멀 시안</p>
    <section class="screens" aria-label="앱 화면 시안">
      <article>
        <p class="label">오늘</p>
        <div class="bar"><span class="brand">WODLog</span><button class="quiet" aria-label="기록 내역">↗</button></div>
        <p class="date">2026년 11월 8일 일요일</p>
        <h2>오늘 운동</h2>
        <div class="empty"><strong>아직 기록이 없어요</strong><span>운동을 시작해 기록을 남겨보세요.</span></div>
        <button class="primary">운동 시작</button>
      </article>
      <article>
        <p class="label">운동 기록</p>
        <div class="bar"><span class="quiet" aria-label="뒤로">‹</span><span class="brand">오늘 운동</span><button class="quiet" aria-label="더 보기">···</button></div>
        <p class="date">2026년 11월 8일 일요일</p>
        <div class="section">와드</div>
        <button class="add">＋ 와드 추가</button>
        <div class="section">근력 운동</div>
        <div class="row"><span>Back Squat</span><span>＋</span></div>
        <div class="set">세트 1 <span>60 kg × 5</span></div>
        <div class="set">세트 2 <span>65 kg × 5</span></div>
        <button class="add">＋ 운동 블록 추가</button>
      </article>
    </section>
  </main>
</body>
</html>
